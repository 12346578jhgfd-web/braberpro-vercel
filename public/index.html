<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<!-- viewport = faz o site se ajustar à tela do celular -->
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BarberPro</title>
<style>
/* ===== CORES (mude aqui para trocar o visual) ===== */
:root{--bg:#14110f;--card:#1f1a17;--gold:#c8913a;--tx:#f2ebe3;--mut:#9b9087;--bd:#352d28;--red:#e0605c;--grn:#4caf7a}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1{font-size:22px;margin:0}h3{margin:24px 0 8px}
input,select{width:100%;padding:10px;background:#0f0d0b;border:1px solid var(--bd);color:var(--tx);border-radius:8px;font-size:16px}
label{display:block;margin:8px 0;font-size:13px;color:var(--mut)}
button{background:var(--gold);color:#111;border:0;padding:9px 14px;border-radius:8px;font-weight:600;cursor:pointer}
.ghost{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.red{color:var(--red)}.mut{color:var(--mut)}.err{color:var(--red);min-height:18px}
/* ===== MENU: lateral no PC, embaixo no celular ===== */
nav{width:210px;background:var(--card);padding:16px;position:fixed;top:0;bottom:0;display:flex;flex-direction:column;gap:4px}
nav h2{color:var(--gold);margin:0 0 12px}
nav a{padding:10px 12px;border-radius:8px;cursor:pointer;color:var(--mut)}
nav a.on{background:var(--bd);color:var(--gold)}
main{margin-left:210px;padding:24px}
.top{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.tools{display:flex;gap:8px;flex-wrap:wrap}.tools input{width:auto}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px}
.card small{color:var(--mut);display:block}.card b{font-size:22px;color:var(--gold)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;background:var(--card);border-radius:12px}
th,td{padding:10px;text-align:left;border-bottom:1px solid var(--bd);font-size:14px}
th{color:var(--mut);font-weight:500}
.act{white-space:nowrap}.act button{margin:2px;padding:5px 9px;font-size:12px}
.b{padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid}
.b.red{border-color:var(--red)}.b.grn{border-color:var(--grn);color:var(--grn)}
dialog{background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:12px;width:min(92vw,420px)}
dialog::backdrop{background:#0009}
.row{display:flex;gap:8px;justify-content:flex-end;margin-top:10px}
.login{max-width:340px;margin:12vh auto;padding:24px;display:flex;flex-direction:column;gap:12px;background:var(--card);border-radius:14px}
/* ===== IMPRESSÃO: ao imprimir/salvar em PDF, some o menu e fica fundo branco ===== */
@media print{body{background:#fff;color:#000}nav,.tools,.noprint{display:none}main{margin:0;padding:0}
 .card,table{background:#fff;color:#000}.card b{color:#000}th,td{border-color:#999}}
/* ===== CELULAR (telas até 768px) ===== */
@media(max-width:768px){
 nav{top:auto;width:auto;left:0;right:0;flex-direction:row;overflow-x:auto;padding:6px;z-index:5}
 nav h2{display:none}nav a{white-space:nowrap;font-size:13px}
 main{margin:0;padding:14px 12px 80px}
}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog> <!-- janela pop-up usada pelos formulários -->

<script>
// ============================================================
// BARBERPRO - TELAS (frontend)
// Este código desenha as telas e "conversa" com o servidor (api).
// IMPORTANTE: esconder um botão NÃO protege nada. Quem protege
// de verdade é o servidor (ele confere o perfil em toda rota).
// ============================================================
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); // evita injeção de código
const brl = n => Number(n || 0).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
let me = null, page = 'painel', Q = '', CUR = {};
let MES = new Date().toLocaleDateString('en-CA').slice(0, 7); // mês mostrado no Painel (AAAA-MM)
let DATE = new Date().toLocaleDateString('en-CA'); // data de hoje (AAAA-MM-DD)

// ---- Fala com o servidor. Se der erro, lança a mensagem dele ----
async function api(url, method = 'GET', body) {
  const r = await fetch('/api/' + url, {method, headers:{'Content-Type':'application/json'}, body: body ? JSON.stringify(body) : undefined});
  const d = await r.json().catch(() => ({}));
  if (r.status === 401 && url !== 'login') { me = null; showLogin(); throw new Error('Sessão expirada'); }
  if (!r.ok) throw new Error(d.erro || 'Erro');
  return d;
}
// Executa uma ação, mostra erro se falhar e redesenha a tela
const run = async f => { try { await f(); render(); } catch (e) { if (me) alert(e.message); } };

// ---- Menu: [nome, perfis que enxergam] ----
const ALL = ['admin','gerente','operador'], GER = ['admin','gerente'];
const MENU = {
  painel:['📊 Painel',GER], agenda:['📅 Agenda',ALL], clientes:['👤 Clientes',ALL],
  profissionais:['✂ Profissionais',GER], servicos:['💈 Serviços',GER],
  caixa:['💰 Caixa',GER], usuarios:['🔑 Usuários',['admin']]
};
const go = p => { page = p; Q = ''; render(); };
const logout = async () => { await api('logout', 'POST'); me = null; showLogin(); };

// ---- Peças reutilizáveis: cabeçalho, tabela e formulário pop-up ----
const head = (t, extra = '') => `<div class="top"><h1>${t}</h1><div class="tools">${extra}</div></div>`;
const search = () => `<input placeholder="Pesquisar..." value="${esc(Q)}" onchange="Q=this.value;render()">`;
// cols = [campo, título, (função opcional que formata)]
const table = (cols, rows, actions) => `<div class="scroll"><table><tr>${cols.map(c => `<th>${c[1]}</th>`).join('')}<th></th></tr>
 ${rows.map(r => `<tr>${cols.map(c => `<td>${c[2] ? c[2](r) : esc(r[c[0]])}</td>`).join('')}<td class="act">${actions(r)}</td></tr>`).join('')}</table></div>
 ${rows.length ? '' : '<p class="mut">Nada por aqui ainda.</p>'}`;
// fields = [{k:campo, l:rótulo, t:tipo, o:opções do select, r:0 se opcional}]
function openForm(title, fields, v, save) {
  const d = $('#dlg');
  d.innerHTML = `<form><h3>${title}</h3>${fields.map(f => `<label>${f.l}${f.t === 'select'
    ? `<select name="${f.k}">${f.o.map(o => `<option value="${o[0]}" ${o[0] == v[f.k] ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`
    : `<input name="${f.k}" type="${f.t || 'text'}" step="0.01" min="0" value="${esc(v[f.k])}" ${f.r === 0 ? '' : 'required'}>`}</label>`).join('')}
    <p class="err" id="err"></p><div class="row"><button type="button" class="ghost" onclick="$('#dlg').close()">Cancelar</button><button>Salvar</button></div></form>`;
  d.querySelector('form').onsubmit = async e => {
    e.preventDefault();
    try { await save(Object.fromEntries(new FormData(e.target))); d.close(); render(); } catch (x) { $('#err').textContent = x.message; }
  };
  d.showModal();
}

// ---- LOGIN ----
function showLogin() {
  $('#app').innerHTML = `<form id="lg" class="login"><h1>✂ BarberPro</h1>
   <input name="email" placeholder="E-mail ou usuário" required><input name="password" type="password" placeholder="Senha" required>
   <p class="err" id="le"></p><button>Entrar</button></form>`;
  $('#lg').onsubmit = async e => {
    e.preventDefault();
    try { await api('login', 'POST', Object.fromEntries(new FormData(e.target))); me = await api('me'); page = 'painel'; render(); }
    catch (x) { $('#le').textContent = x.message; }
  };
}

// ---- PÁGINAS (cada uma devolve o HTML da tela) ----
const P = {};

// Páginas de cadastro simples (clientes, profissionais, serviços)
async function simple(ep, label, fields, cols, canEdit) {
  const rows = await api(ep + '?q=' + encodeURIComponent(Q));
  CUR = {rows, ep, fields, label};
  return head(label + 's', search() + (canEdit ? '<button onclick="add()">+ Novo</button>' : '')) +
    table(cols, rows, r => canEdit ? `<button class="ghost" onclick="edit(${r.id})">Editar</button><button class="ghost red" onclick="del(${r.id})">Excluir</button>` : '');
}
const add = () => openForm('Novo ' + CUR.label, CUR.fields, {}, o => api(CUR.ep, 'POST', o));
const edit = id => openForm('Editar', CUR.fields, CUR.rows.find(r => r.id == id), o => api(CUR.ep + '/' + id, 'PUT', o));
const del = id => confirm('Desativar este registro?') && run(() => api(CUR.ep + '/' + id, 'DELETE'));

P.clientes = () => simple('clientes', 'Cliente', [{k:'name', l:'Nome'}, {k:'phone', l:'Telefone', t:'tel'}], [['name','Nome'], ['phone','Telefone']], true);
P.profissionais = () => simple('profissionais', 'Profissional', [{k:'name', l:'Nome'}, {k:'commission', l:'Comissão (%)', t:'number'}], [['name','Nome'], ['commission','Comissão',r => r.commission + '%']], true);
P.servicos = () => simple('servicos', 'Serviço', [{k:'name', l:'Nome'}, {k:'price', l:'Preço (R$)', t:'number'}], [['name','Serviço'], ['price','Preço',r => brl(r.price)]], true);

// Painel com indicadores
P.painel = async () => {
  const d = await api('dashboard?mes=' + MES);
  return head('Painel') + `<div class="noprint"><h3>Relatórios</h3>
   <div class="tools"><label>Mês do relatório <input type="month" value="${MES}" onchange="MES=this.value||MES;render()"></label>
   <button onclick="baixarMes()">⬇ Serviços do mês (CSV)</button></div><br>
   <div class="tools"><input type="date" id="de" title="De"><input type="date" id="ate" title="Até">
   <button onclick="baixar('financeiro')">⬇ Financeiro (CSV)</button><button onclick="baixar('atendimentos')">⬇ Atendimentos (CSV)</button>
   <button class="ghost" onclick="window.print()">🖨 Imprimir / PDF</button></div>
   <p class="mut">Deixe as datas vazias para baixar tudo. O arquivo CSV abre no Excel.</p></div><div class="cards">${[['Atendimentos hoje', d.hoje], ['Receitas do mês', brl(d.receita)], ['Despesas do mês', brl(d.despesa)], ['Saldo do mês', brl(d.receita - d.despesa)]]
    .map(c => `<div class="card"><small>${c[0]}</small><b>${c[1]}</b></div>`).join('')}</div>
   <h3>Comissões em ${MES}</h3>` + table([['name','Profissional'], ['n','Atendimentos'], ['total','Faturado',r => brl(r.total)], ['comissao','Comissão',r => brl(r.comissao)]], d.comissoes, () => '') +
   `<h3>Serviços feitos em ${MES}</h3>` + table([['name','Serviço'], ['n','Qtd'], ['total','Total',r => brl(r.total)]], d.top, () => '');
};

// Agenda do dia
P.agenda = async () => {
  const [rows, cl, pr, sv] = await Promise.all([api('agenda?date=' + DATE), api('clientes'), api('profissionais'), api('servicos')]);
  CUR = {rows, cl, pr, sv};
  const st = {agendado:'', concluido:'<span class="b grn">Concluído</span>', cancelado:'<span class="b red">Cancelado</span>'};
  return head('Agenda', `<input type="date" value="${DATE}" onchange="DATE=this.value;render()"><button onclick="novoAg()">+ Agendar</button>${GER.includes(me.role) ? `<button class="ghost red" onclick="cancelarTodos(false)">Cancelar todos do dia</button><button class="ghost red" onclick="cancelarTodos(true)">Cancelar todos (todas as datas)</button><button class="ghost red" onclick="cancelarConcluidos(false)">Cancelar concluídos do dia</button><button class="ghost red" onclick="cancelarConcluidos(true)">Cancelar concluídos (todas as datas)</button>` : ''}`) +
    table([['time','Hora'], ['client','Cliente'], ['professional','Profissional'], ['service','Serviço'], ['price','Valor',r => brl(r.price)], ['status','Status',r => st[r.status]]], rows,
      r => r.status === 'agendado' ? `<button onclick="run(()=>api('agenda/${r.id}/concluir','POST'))">Concluir</button><button class="ghost red" onclick="confirm('Cancelar?')&&run(()=>api('agenda/${r.id}/cancelar','POST'))">Cancelar</button>` : '');
};
const novoAg = () => openForm('Novo agendamento', [
  {k:'client_id', l:'Cliente', t:'select', o:CUR.cl.map(x => [x.id, x.name])},
  {k:'professional_id', l:'Profissional', t:'select', o:CUR.pr.map(x => [x.id, x.name])},
  {k:'service_id', l:'Serviço', t:'select', o:CUR.sv.map(x => [x.id, x.name + ' - ' + brl(x.price)])},
  {k:'date', l:'Data', t:'date'}, {k:'time', l:'Hora', t:'time'}], {date:DATE}, o => api('agenda', 'POST', o));

// Baixar relatório: abre o endereço do servidor, o navegador baixa o arquivo
const baixar = tipo => { window.location = `/api/relatorio/${tipo}?de=${$('#de').value}&ate=${$('#ate').value}`; };
// Relatório mensal de serviços: o mês escolhido vira data inicial e final
const baixarMes = () => { window.location = `/api/relatorio/servicos_mensal?de=${MES}-01&ate=${MES}-31`; };
// Cancelar todos os agendamentos pendentes (do dia mostrado ou de todas as datas)
const cancelarTodos = todas => {
  if (!confirm(todas ? 'Cancelar TODOS os agendamentos pendentes de TODAS as datas?' : 'Cancelar todos os agendamentos pendentes do dia ' + DATE + '?')) return;
  run(async () => { const r = await api('agenda/cancelar-todos', 'POST', {todas, date: DATE}); alert(r.cancelados + ' agendamento(s) cancelado(s).'); });
};

// Cancelar atendimentos CONCLUÍDOS: o servidor lança estornos no caixa aberto
const cancelarConcluidos = todas => {
  if (!confirm((todas ? 'Cancelar TODOS os atendimentos concluídos de TODAS as datas?' : 'Cancelar os atendimentos concluídos do dia ' + DATE + '?') + '\nSerá lançado um estorno no caixa para cada um.')) return;
  run(async () => { const r = await api('agenda/cancelar-concluidos', 'POST', {todas, date: DATE}); alert(r.cancelados + ' atendimento(s) cancelado(s) e estornado(s).'); });
};

// Caixa
P.caixa = async () => {
  const c = await api('caixa');
  if (!c.aberto) return head('Caixa', '<button onclick="abrirCx()">Abrir caixa</button>') + '<p class="mut">O caixa está fechado.</p>';
  return head('Caixa', '<button onclick="despesa()">+ Despesa</button><button class="ghost" onclick="fecharCx()">Fechar caixa</button>') +
    `<div class="cards">${[['Abertura', brl(c.aberto.opening)], ['Receitas', brl(c.receitas)], ['Despesas', brl(c.despesas)], ['Saldo', brl(c.saldo)]]
      .map(x => `<div class="card"><small>${x[0]}</small><b>${x[1]}</b></div>`).join('')}</div>` +
    table([['created_at','Data/hora'], ['type','Tipo'], ['description','Descrição'], ['amount','Valor',r => brl(r.amount)]], c.entries, () => '');
};
const abrirCx = () => openForm('Abrir caixa', [{k:'valor', l:'Valor inicial (R$)', t:'number'}], {valor:0}, o => api('caixa/abrir', 'POST', o));
const despesa = () => openForm('Nova despesa', [{k:'description', l:'Descrição'}, {k:'amount', l:'Valor (R$)', t:'number'}], {}, o => api('caixa/despesa', 'POST', o));
const fecharCx = () => confirm('Fechar o caixa?') && run(() => api('caixa/fechar', 'POST'));

// Usuários (só admin)
const RO = [['admin','Administrador'], ['gerente','Gerente'], ['operador','Operador']];
P.usuarios = async () => {
  const rows = await api('usuarios'); CUR = {rows};
  return head('Usuários', '<button onclick="newUser()">+ Novo</button>') +
    table([['name','Nome'], ['email','E-mail/usuário'], ['role','Perfil'], ['blocked','Status',r => r.blocked ? '<span class="b red">Bloqueado</span>' : '<span class="b grn">Ativo</span>']], rows,
      r => `<button class="ghost" onclick="editUser(${r.id})">Editar</button><button class="ghost" onclick="userAct(${r.id},'${r.blocked ? 'unblock' : 'block'}')">${r.blocked ? 'Desbloquear' : 'Bloquear'}</button><button class="ghost" onclick="userAct(${r.id},'reset')">Senha</button><button class="ghost red" onclick="userAct(${r.id},'del')">Excluir</button>`);
};
const uf = [{k:'name', l:'Nome'}, {k:'email', l:'E-mail ou usuário'}, {k:'role', l:'Perfil', t:'select', o:RO}];
const newUser = () => openForm('Novo usuário', [...uf, {k:'password', l:'Senha (mín. 8 caracteres)', t:'password'}], {role:'operador'}, o => api('usuarios', 'POST', o));
const editUser = id => openForm('Editar usuário', uf, CUR.rows.find(r => r.id == id), o => api('usuarios/' + id, 'PUT', o));
const userAct = (id, a) => run(async () => {
  if (a === 'del') { if (!confirm('Desativar este usuário?')) return; await api('usuarios/' + id, 'DELETE'); }
  else if (a === 'reset') { if (!confirm('Gerar nova senha?')) return; const r = await api('usuarios/' + id + '/reset', 'POST'); alert('Senha temporária (aparece só agora, anote):\n' + r.senha); }
  else await api('usuarios/' + id + '/' + a, 'POST');
});

// ---- Desenha a tela inteira (menu + página atual) ----
async function render() {
  if (!me) return showLogin();
  const nav = Object.entries(MENU).filter(([k, v]) => v[1].includes(me.role)); // só o que o perfil pode ver
  if (!MENU[page] || !MENU[page][1].includes(me.role)) page = nav[0][0];
  let html;
  try { html = await P[page](); } catch (e) { if (!me) return; html = `<p class="err">${esc(e.message)}</p>`; }
  $('#app').innerHTML = `<nav><h2>✂ BarberPro</h2>${nav.map(([k, v]) => `<a class="${k == page ? 'on' : ''}" onclick="go('${k}')">${v[0]}</a>`).join('')}<a onclick="logout()">🚪 Sair</a></nav><main>${html}</main>`;
}

// ---- Início: se já estiver logado, entra direto ----
api('me').then(u => { me = u; render(); }).catch(showLogin);
</script>
</body>
</html>
